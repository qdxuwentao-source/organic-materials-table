<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实验室药品清单 · 储存位置</title>
<style>
:root{--bg:#0e1420;--bg2:#141c2e;--card:#1a2336;--line:#2a3650;--txt:#e8edf7;--dim:#93a2c0;--accent:#6aa9ff;--warn:#ffd59a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif}
body{padding-bottom:40px}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:50;background:rgba(14,20,32,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 22px}
.hd{max-width:1400px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
h1{font-size:20px;font-weight:700}
h1 .sub{display:block;font-size:11.5px;font-weight:400;color:var(--dim);margin-top:2px}
.hd-controls{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search input{width:260px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);color:var(--txt);font-size:13px;outline:none}
.search input:focus{border-color:var(--accent)}
#count{font-size:12px;color:var(--dim)}
main{max-width:1400px;margin:14px auto;padding:0 22px}
.locchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}
.locchips .c{font-size:11.5px;color:var(--dim);border:1px solid var(--line);border-radius:14px;padding:3px 10px;cursor:pointer;user-select:none;background:var(--bg2)}
.locchips .c:hover{border-color:var(--accent)}
.locchips .c.on{background:rgba(106,169,255,.2);border-color:var(--accent);color:var(--txt)}
.table-wrap{overflow:auto;max-height:calc(100vh - 190px);border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:900px}
thead th{position:sticky;top:0;background:var(--card);color:var(--dim);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap;z-index:5}
tbody td{padding:6px 10px;border-bottom:1px solid rgba(42,54,80,.4);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:rgba(106,169,255,.06)}
tbody tr.muted{opacity:.12}
tbody tr.found{outline:1px solid var(--accent);outline-offset:-1px}
td .nm{font-weight:600}
td .cas{color:var(--dim);font-family:Consolas,monospace;font-size:11px}
td .spec{color:var(--dim)}
.loc-badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:10px;white-space:nowrap;color:#fff}
#modal{position:fixed;inset:0;background:rgba(6,10,18,.72);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
#modal.show{display:flex}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:560px;width:100%;max-height:84vh;overflow:auto;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mhead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.mhead .nm{font-size:20px;font-weight:800}
.mhead .x{margin-left:auto;cursor:pointer;font-size:22px;color:var(--dim);border:none;background:none}
.mhead .x:hover{color:var(--txt)}
.info{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin-bottom:12px}
.info .k{color:var(--dim)}
.info .v{color:var(--txt);word-break:break-all}
.synth-title{font-size:13.5px;font-weight:700;margin:10px 0 8px;color:var(--warn)}
.synth{display:flex;flex-wrap:wrap;gap:6px}
.synth .s{background:rgba(255,213,154,.1);border:1px solid rgba(255,213,154,.35);color:var(--warn);border-radius:12px;padding:4px 10px;font-size:12px}
.no-synth{font-size:12px;color:var(--dim)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:300;background:rgba(20,28,48,.96);border:1px solid var(--line);border-radius:10px;padding:10px 18px;font-size:13px;display:none;max-width:82vw;text-align:center}
#toast.show{display:block}
footer{max-width:1400px;margin:18px auto 0;padding:0 22px;color:var(--dim);font-size:11.5px;line-height:1.8}
@media (max-width:640px){h1{font-size:17px}.search input{width:170px}}

.synth .s{cursor:pointer}
.synth .s:hover{background:rgba(255,213,154,.22)}
.synth .s.na{cursor:default;opacity:.6}
.synth .s.na:hover{background:rgba(255,213,154,.1)}
#rmodal{position:fixed;inset:0;background:rgba(6,10,18,.78);z-index:250;display:none;align-items:center;justify-content:center;padding:20px}
#rmodal.show{display:flex}
.rmbox{background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:680px;width:100%;max-height:86vh;overflow:auto;padding:22px 26px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.rmhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.rmhead .nm{font-size:21px;font-weight:800}
.rmhead .en{color:var(--dim);font-size:13px}
.rmhead .x{margin-left:auto;cursor:pointer;font-size:24px;color:var(--dim);border:none;background:none}
.rmhead .x:hover{color:var(--txt)}
.rmbody{display:flex;gap:18px;flex-wrap:wrap}
.rmimg{flex:0 0 200px;text-align:center}
.rmimg img{max-width:200px;max-height:200px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px}
.rmimg .note{font-size:11px;color:var(--dim);margin-top:6px}
.rminfo{flex:1;min-width:240px}
.rm-row{display:flex;gap:10px;margin-bottom:10px;font-size:13.5px}
.rm-row .k{color:var(--dim);flex:0 0 64px}
.rm-row .v{flex:1}
.rm-row .v.f{font-family:Consolas,monospace;font-size:14px;color:var(--warn)}
.rm-cond{background:rgba(255,213,154,.08);border:1px solid rgba(255,213,154,.25);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.7;color:var(--txt)}
.rm-cond .t{color:var(--warn);font-weight:700;margin-bottom:4px}
</style>
</head>

<script>
(function(){
'use strict';
var tbody=document.getElementById('tbody');
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
// location color
function locColor(loc){
  var h=0; for(var i=0;i<loc.length;i++) h=(h*31+loc.charCodeAt(i))>>>0;
  var hue=h%360;
  return 'hsl('+hue+',62%,52%)';
}
function render(list){
  tbody.innerHTML='';
  list.forEach(function(it){
    var tr=document.createElement('tr');
    tr.dataset.idx=it.n;
    tr.innerHTML='<td style="color:var(--dim)">'+it.n+'</td>'+
      '<td class="cas">'+esc(it.code)+'</td>'+
      '<td><span class="nm">'+esc(it.name)+'</span></td>'+
      '<td class="cas">'+esc(it.cas)+'</td>'+
      '<td class="spec">'+esc(it.spec)+'</td>'+
      '<td><span class="loc-badge" style="background:'+locColor(it.loc)+'">'+esc(it.loc)+'</span></td>';
    tr.addEventListener('click',function(){ showModal(it); });
    tr.addEventListener('contextmenu',function(ev){ ev.preventDefault(); showModal(it); });
    tbody.appendChild(tr);
  });
}
var modal=document.getElementById('modal');
function showToast(msg){
  var t=document.getElementById('toast');
  if(!t) return;
  t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._t); showToast._t=setTimeout(function(){ t.classList.remove('show'); },2200);
}
function openRoute(prod){
  var rt=ROUTES[prod];
  if(!rt){ showToast('暂无「'+prod+'」的合成路线资料'); return; }
  document.getElementById('rmname').textContent=prod;
  document.getElementById('rmen').textContent=rt.en||'';
  document.getElementById('rmformula').textContent=rt.formula||'—';
  document.getElementById('rmmw').textContent=rt.mw?rt.mw:'—';
  document.getElementById('rmcond').textContent=rt.cond||'暂无反应条件资料';
  var img=document.getElementById('rmimg');
  if(rt.img){ img.src=rt.img; img.style.display=''; } else { img.style.display='none'; }
  document.getElementById('rmimgnote').textContent=rt.imgNote||'';
  document.getElementById('rmodal').classList.add('show');
}
function showModal(it){
  document.getElementById('mname').textContent=it.name;
  document.getElementById('mcode').textContent=it.code||'—';
  document.getElementById('mcas').textContent=it.cas||'—';
  document.getElementById('mspec').textContent=it.spec||'—';
  document.getElementById('mloc').textContent=it.loc||'—';
  var syn=SYNTH[it.cas];
  var wrap=document.getElementById('msynth');
  if(syn && syn.length){
    document.getElementById('synthTitle').style.display='';
    wrap.innerHTML='';
    syn.forEach(function(s){ var d=document.createElement('button'); d.type='button'; d.className='s'+(ROUTES[s]?'':' na'); d.textContent=s; d.title=ROUTES[s]?'点击查看「'+s+'」的合成路线':'暂无合成路线资料'; if(ROUTES[s]){ d.addEventListener('click',function(ev){ ev.stopPropagation(); openRoute(s); }); } wrap.appendChild(d); });
  } else {
    document.getElementById('synthTitle').style.display='none';
    wrap.innerHTML='<span class="no-synth">暂无该药品可合成产物的记录（如需补充可提供资料）</span>';
  }
  modal.classList.add('show');
}
document.getElementById('mclose').addEventListener('click',function(){ modal.classList.remove('show'); });
document.getElementById('rmclose').addEventListener('click',function(){ document.getElementById('rmodal').classList.remove('show'); });
document.getElementById('rmodal').addEventListener('click',function(ev){ if(ev.target===document.getElementById('rmodal')) document.getElementById('rmodal').classList.remove('show'); });
modal.addEventListener('click',function(ev){ if(ev.target===modal) modal.classList.remove('show'); });
// search + location filter
var q='', loc='';
function apply(){
  var rows=tbody.querySelectorAll('tr');
  var n=0;
  rows.forEach(function(tr){
    var it=ITEMS.find(function(x){return x.n===parseInt(tr.dataset.idx,10);});
    var hit=!q||it.name.toLowerCase().indexOf(q)>=0||it.cas.indexOf(q)>=0||it.code.toLowerCase().indexOf(q)>=0;
    var locHit=!loc||it.loc===loc;
    tr.classList.toggle('muted',!(hit&&locHit));
    tr.classList.toggle('found',!!q&&hit);
    if(hit&&locHit)n++;
  });
  document.getElementById('count').textContent='共 '+ITEMS.length+' 种 ｜ 当前显示 '+n+' 种';
}
document.getElementById('search').addEventListener('input',function(e){ q=e.target.value.trim().toLowerCase(); apply(); });
LOCCS.forEach(function(l){
  var d=document.createElement('span');
  d.className='c'; d.textContent=l.name+'（'+l.count+'）'; d.dataset.loc=l.name;
  d.addEventListener('click',function(){
    loc=(loc===l.name)?'':l.name;
    document.querySelectorAll('.locchips .c').forEach(function(x){x.classList.remove('on');});
    if(loc)d.classList.add('on');
    apply();
  });
  document.getElementById('locchips').appendChild(d);
});
render(ITEMS);
apply();
})();
</script>
